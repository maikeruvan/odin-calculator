<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="main.css">
    <script type="module" src="main.js"></script>
</head>
<body>
    <div class="calculator">
        <input type="text" placeholder="0" spellcheck="false" class="display">
        <div class="clearing">
            <button type="button" class="clear-all">C</button>
            <button type="button" class="erase">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
                    <path d="M183.1 137.4C170.6 124.9 150.3 124.9 137.8 137.4C125.3 149.9 125.3 170.2 137.8 182.7L275.2 320L137.9 457.4C125.4 469.9 125.4 490.2 137.9 502.7C150.4 515.2 170.7 515.2 183.2 502.7L320.5 365.3L457.9 502.6C470.4 515.1 490.7 515.1 503.2 502.6C515.7 490.1 515.7 469.8 503.2 457.3L365.8 320L503.1 182.6C515.6 170.1 515.6 149.8 503.1 137.3C490.6 124.8 470.3 124.8 457.8 137.3L320.5 274.7L183.1 137.4z"/>
                </svg>
            </button>
            <button type="button" id="=" class="equals">=</button>
        </div>
        <div class="controls">
            <div class="numbers">
                <div class="row">
                    <button type="button" id="7">7</button>
                    <button type="button" id="8">8</button>
                    <button type="button" id="9">9</button>
                </div>
                <div class="row">
                    <button type="button" id="4">4</button>
                    <button type="button" id="5">5</button>
                    <button type="button" id="6">6</button>
                </div>
                <div class="row">
                    <button type="button" id="1">1</button>
                    <button type="button" id="2">2</button>
                    <button type="button" id="3">3</button>
                </div>
                <div class="row">
                    <button type="button" id="00">00</button>
                    <button type="button" id="0">0</button>
                    <button type="button" id=".">.</button>
                </div>
            </div>
            <div class="operators">
                <button type="button" id="*">*</button>
                <button type="button" id="/">&divide;</button>
                <button type="button" id="+">+</button>
                <button type="button" id="-">-</button>
            </div>
        </div>
    </div>
</body>
</html>
