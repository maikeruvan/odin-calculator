<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="main.css">
    <script type="module" src="main.js"></script>
</head>
<body>
    <div class="calculator">
        <input type="text" spellcheck="false" disabled class="display" id="screen-display">
        <div class="clearing">
            <button type="button" class="clear-all" id="clear-all">C</button>
            <button type="button" class="erase" id="erase">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960">
                    <path d="m336-280 144-144 144 144 56-56-144-144 144-144-56-56-144 144-144-144-56 56 144 144-144 144 56 56ZM480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm0-320Z"/>
                </svg>
            </button>
            <button type="button" id="=" class="equals">=</button>
        </div>
        <div class="controls">
            <div class="numbers">
                <div class="row">
                    <button type="button" id="7">7</button>
                    <button type="button" id="8">8</button>
                    <button type="button" id="9">9</button>
                </div>
                <div class="row">
                    <button type="button" id="4">4</button>
                    <button type="button" id="5">5</button>
                    <button type="button" id="6">6</button>
                </div>
                <div class="row">
                    <button type="button" id="1">1</button>
                    <button type="button" id="2">2</button>
                    <button type="button" id="3">3</button>
                </div>
                <div class="row">
                    <button type="button" id="0">0</button>
                    <button type="button" id=".">.</button>
                </div>
            </div>
            <div class="operators">
                <button type="button" id="*">*</button>
                <button type="button" id="/">&divide;</button>
                <button type="button" id="+">+</button>
                <button type="button" id="-">-</button>
            </div>
        </div>
    </div>
</body>
</html>
