<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="main.css">
    <script type="module" src="main.js"></script>
</head>
<body>
    <div class="calculator">
        <div class="screen-display">
            <span class="previous-value" id="previous-value">89800</span>
            <span class="operator" id="operator">+</span>
            <span class="current-value" id="current-value">1241412</span>
        </div>
        <div class="clear-controls" id="clear-controls">
            <button type="button" class="all-clear" id="ac">AC</button>
            <button type="button" class="clear-entry" id="ce">CE</button>
        </div>
        <div class="number-keys" id="number-keys">
            <button type="button" id="7">7</button>
            <button type="button" id="8">8</button>
            <button type="button" id="9">9</button>
            <button type="button" id="4">4</button>
            <button type="button" id="5">5</button>
            <button type="button" id="6">6</button>
            <button type="button" id="1">1</button>
            <button type="button" id="2">2</button>
            <button type="button" id="3">3</button>
            <button type="button" id="0">0</button>
            <button type="button" id=".">.</button>
        </div>
        <div class="operators" id="operators">
            <button type="button" id="*">&times;</button>
            <button type="button" id="/">&divide;</button>
            <button type="button" id="+">&plus;</button>
            <button type="button" id="-">&minus;</button>
        </div>
        <div class="equals">
            <button type="button" class="equal-sign" id="equal-sign">&equals;</button>
        </div>
    </div>
</body>
</html>
